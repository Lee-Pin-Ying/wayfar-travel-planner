x="4" ry="9"/><path d="M3 12h18"/>',spark:'<path d="m12 2 2.5 7.5L22 12l-7.5 2.5L12 22l-2.5-7.5L2 12l7.5-2.5Z"/>'};

const KEY='wayfar-v1';const TODAY=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};

function scenic(){return `<svg class="hero-art" viewBox="0 0 850 350" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><defs><linearGradient id="sky" x2="0" y2="1"><stop stop-color="#d6dfc7"/><stop offset="1" stop-color="#eee7ca"/></linearGradient><linearGradient id="hill" x2="1" y2="1"><stop stop-color="#829474"/><stop offset="1" stop-color="#5b7962"/></linearGradient><pattern id="grain" width="5" height="5" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".45" fill="#233f2e" opacity=".06"/></pattern></defs><path fill="url(#sky)" d="M0 0h850v350H0Z"/><circle cx="609" cy="88" r="41" fill="#f5edce"/><path d="M0 195Q100 155 178 180T350 142T500 180T670 130T850 158V350H0Z" fill="#acb99b"/><path d="M150 246Q230 135 337 176T520 159Q650 137 850 225V350H150Z" fill="#95a489"/><path d="M0 300Q150 210 290 256T528 207T850 186V350H0Z" fill="url(#hill)"/><path d="M420 350q-40-49 32-74t53-49q-30-17 30-29-29 16-6 27 22 25-44 51-63 25-14 74" fill="#e0d8ad"/><path d="M635 350q-10-41 38-78t177-41v119Z" fill="#395c49"/><path d="M0 320Q165 260 333 350Z" fill="#52715a"/><g stroke="#5b7455" fill="none" stroke-width="2"><path d="m700 88 8 3 8-4m-36 13 6 3 7-3m-46-35 5 2 5-2"/></g><g transform="translate(604 196)"><path d="M-9 17h30V0H-9Z" fill="#e7dfbc"/><path d="m-15 0 20-14L27 0Z" fill="#8a7656"/><path d="M1 17V7h8v10" fill="#596c4e"/></g><g fill="#496347"><path d="m745 204 9-34 10 34h-7v23h-6v-23Z"/><path d="m777 215 12-42 12 42h-8v27h-7v-27Z"/></g><path fill="url(#grain)" d="M0 0h850v350H0Z"/></svg>`;}
const navItems=[['overview','home','旅程總覽','Overview','總覽'],['prepare','bag','行前準備','Prepare','行前'],['itinerary','map','每日行程','Itinerary','行程'],['expenses','wallet','旅費與分帳','Expenses','旅費'],['gifts','gift','伴手禮清單','Little gifts','伴手禮']];

$('#app').innerHTML=`<aside class="sidebar"><a class="brand" href="#overview" aria-label="旅序首頁"><div class="brand-mark">${icon('compass')}</div><div><div class="brand-name">旅序</div><div class="brand-sub">WAYFAR</div></div></a><div class="trip-select"><label for="trip-select">YOUR LITTLE GETAWAY</label><select id="trip-select" data-change="trip" aria-label="切換旅程">${sel||'<option>開始一段新旅程</option>'}</select></div><div class="nav-label">旅行手帳</div><nav class="nav" aria-label="主要導航">${nav()}</nav><div class="sidebar-foot"><div class="side-note"><div class="serif">留一點空白，給風景。</div>把瑣碎交給旅序，<br>把時間留給喜歡的地方。</div><div class="side-actions"><button class="btn ghost" data-action="export">${icon('download')}備份</button><button class="btn ghost" data-action="import">${icon('upload')}匯入</button></div><div id="save-status" class="save-status"></div></div></aside><main class="main"><header class="topbar"><div class="breadcrumb">我的旅程 ${icon('chevron')} <span>${esc(t?.title||'新的開始')}</span>${t?.isDemo?'<span class="pill outline">示範旅程</span>':''}</div><div class="mobile-brand">旅序 <small>WAYFAR</small>${t?`<select data-change="trip" aria-label="切換旅程">${sel}</select>`:''}</div><div class="topbar-actions">${t?`<button class="icon-btn" data-action="settings" aria-label="旅程設定與備份">${icon('edit')}</button><div class="avatars" aria-label="同行者">${t.members.slice(0,3).map(m=>`<span class="avatar" title="${esc(m.name)}">${esc(m.name.slice(0,1))}</span>`).join('')}</div>`:''}<button class="btn" data-action="new-trip">${icon('plus')}新增旅程</button></div></header>${storageError?`<div class="notice">${icon('info')}<span>${loadError?'既有儲存資料無法讀取，已停止自動覆寫。可先下載原始資料備份，再重新啟用儲存。':'瀏覽器無法保存資料，目前的修改只在記憶體中，請匯出備份。'}</span>${loadError?'<button class="btn" data-action="recover-storage">處理</button>':'<button class="btn" data-action="export">匯出</button>'}</div>`:''}<div class="view">${t?renderPage(t):welcome()}</div><footer class="footer"><span>WAYFAR · MADE FOR THE JOURNEY</span><span>資料留在你的瀏覽器，記得偶爾匯出備份。</span></footer></ function welcome(){return `<section class="intro"><div class="intro-inner"><div class="intro-art">${scenic().replace('class="hero-art"','style="width:140px;height:100px;border-radius:50%"')}</div><div class="eyebrow">A LITTLE PLAN. A LOVELY JOURNEY.</div><h1>下一站，<br>是你喜歡的日子。</h1><p>從出門前的那張清單，到回家後的旅行回憶。<br>用一本溫柔的手帳，把旅行慢慢安排好。</p><div class="row"><button class="btn primary" data-action="new-trip">${icon('plus')}建立我的旅程</button><button class="btn" data-action="demo">體驗台南示範 ${icon('arrow')}</button></div><p class="small" style="margin-top:25px">不需登入 · 自動保存 · 國內外都能用</p></div></section>`;}

function stats(t){const total=sum(t.expenses,x=>x.amountCents),nd=days(t),until=Math.round(dateNum(t.startDate)-dateNum(TODAY())),day=until>0?until:Math.min(nd,Math.floor(dateNum(TODAY())-dateNum(t.startDate))+1),ended=TODAY()>t.endDate,pk=t.packing.filter(x=>x.packed).length,tk=t.tasks.filter(x=>x.done).length;return `<div class="stat-grid"><div class="stat"><div class="stat-top">${ended?'回味這段旅程':until>0?'距離下一次出發':'正在旅行中'}${icon('sun')}</div><div class="stat-number">${ended?nd:day}<small>${ended?'天的美好':until>0?'天':'／ '+nd+' 天'}</small></div><div class="stat-foot">${ended?'旅途結束，回憶繼續':until>0?'有期待的日子，真好。':'慢慢走，好好感受。'}</div></div><div class="stat"><div class="stat-top">行前待辦${icon('check')}</div><div class="stat-number">${tk}<small>/ ${t.tasks.length} 項完成</small></div><div class="progress"><i style="width:${pct(tk,t.tasks.length)}%"></i></div></div><div class="stat"><div class="stat-top">行李準備${icon('bag')}</div><div class="stat-number">${pct(pk,t.packing.length)}<small>% 已打包</small></div><div class="progress orange"><i style="width:${pct(pk,t.packing.length)}%"></i></div></div><div class="stat"><div class="stat-top">旅程已花費${icon('wallet')}</div><div class="stat-number">${(total/100).toLocaleString('zh-TW',{maximumFractionDigits:0})}<small>TWD</small></div><div class="stat-foot ${t.budgetCents!==null&&total>t.budgetCents?'warning':''}">${t.budgetCents===null?'尚未設定旅程預算':total>t.budgetCents?'超出預算 '+money(total-t.budgetCents):'預算剩餘 '+money(t.budgetCents-total)}</div></div></div>`;}
function overview(t){const done=t.tasks.filter(x=>x.done).length+t.packing.filter(x=>x.packed).length,all=t.tasks.length+t.packing.length;const next=t.tasks.filter(x=>!x.done).sort((a,b)=>(a.dueDate||'9999').localeCompare(b.dueDate||'9999')).slice(0,3);const preview=TODAY()>=t.startDate&&TODAY()<=t.endDate?TODAY():t.startDate;return `${heading('把日子，交給風景。','一點點計畫，讓每一次出發都更從容。',`<span class="pill outline small-hide">${icon(t.kind==='international'?'globe':'leaf')}${t.kind==='international'?'國外旅行':'國內旅行'}</span>`)}<section class="hero">${scenic()}<div class="hero-copy"><div class="hero-kicker">YOUR NEXT CHAPTER</div><h2>${esc(t.title)}</h2><p class="hero-desc">${esc(t.destination)}，${t.tags.includes('美食')?'用一頓好吃的，認識一座城。':'找一段屬於自己的慢時光。'}</p><div class="hero-bottom"><span>${icon('calendar')}${dateLong(t.startDate)} — ${dateLabel(t.endDate)}</span><span>${icon('people')}${t.members.length} 位旅伴</span><span>${days(t)} 天 ${Math.max(0,days(t)-1)} 夜</span></div></div><div class="postmark">LET'S GO<b>${String(days(t)).padStart(2,'0')}</b>DAYS AWAY</div><div class="hero-loc">${esc(t.destination.toUpperCase())} / A SLOW JOURNEY</div></section>${stats(t)}<div class="overview-grid"><section class="panel"><div class="panel-head"><div class="panel-title">${icon('map')}<h3>${preview===TODAY()?'今天的風景':'第一天，這樣開始'}</h3></div><button class="text-btn" data-action="nav" data-id="itinerary">完整行程 ${icon('arrow')}</button></div><div class="row between" style="margin-bottom:19px"><span class="pill">DAY ${Math.round(dateNum(preview)-dateNum(t.startDate))+1}</span><span class="small muted">${dateLong(preview)}</span></div>${timeline(t,preview,true)}<div class="quick-grid"><button data-action="new-activity">${icon('plus')}新增行程</button><button data-action="new-expense">${icon('wallet')}記一筆旅費</button><button data-action="nav" data-id="prepare">${icon('bag')}繼續打包</button></div></section><div class="overview-side stack"><section class="panel"><div class="panel-head"><div class="panel-title">${icon('leaf')}<h3>出發前，再確認一下</h3></div><span class="small muted">${all?pct(done,all)+'%':'尚無清單'}</span></div><div class="progress" style="margin-bottom:11px"><i style="width:${pct(done,all)}%"></i></div>${next.length?next.map(x=>`<div class="next-card"><label class="check-label grow"><input class="check" type="checkbox" data-check="task" data-id="${x.id}" aria-label="完成${esc(x.title)}"><span><span class="next-title">${esc(x.title)}</span><span class="next-sub" style="display:block">${x.dueDate?`${dateLabel(x.dueDate)} 前完成`:'依自己的步調準備'} ${x.dueDate&&x.dueDate<TODAY()?'<span class="warning">· 已逾期</span>':''}</span></span></label></div>`).join(''):`<div class="empty" style="padding:17px 0"><p>${t.packing.some(x=>!x.packed)?'待辦完成了，再看看行李吧。':'準備妥當，帶著好心情出發。'}</p></div>`}<button class="text-btn" data-action="nav" data-id="prepare" style="margin-top:10px">查看所有準備 ${icon('arrow')}</button></section><section class="tip-card"><span class="eyebrow">A GENTLE REMINDER</span><h3>最好的行程，也留一點空白。</h3><p>別忘了給偶然遇見的小店、喜歡的街角，和一杯咖啡的時間。</p>${icon('compass','stamp')}</section></div></div>`;}
function sortedActivities(t,d){return t.activities.filter(x=>x.date===d).sort((a,b)=>(a.startTime||'99').localeCompare(b.startTime||'99')||a.createdAt-b.createdAt);}
function validLink(url){try{const u=new URL(url);return ['http:','https:'].includes(u.protocol)?u.href:'';}catch{return '';}}
function mapLink(a){return validLink(a.mapUrl)|| (a.place?'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(a.place):'');}
function activityIcon(type){return ['去程','回程','當地交通'].includes(type)?'train':type==='住宿'?'bed':type==='美食'?'food':'pin';}
function overlap(a,b){return a.id!==b.id&&a.date===b.date&&a.startTime&&a.endTime&&b.startTime&&b.endTime&&!a.crossZone&&!b.crossZone&&a.startTime<b.endTime&&b.startTime<a.endTime;}
function activityCard(a,t,compact=false){const link=mapLink(a);return `<div class="activity ${a.done?'done':''}"><div class="row between"><div class="grow"><div class="row wrap" style="gap:7px"><h4>${esc(a.title)}</h4><span class="activity-type ${a.type==='美食'?'food':a.type==='住宿'?'stay':''}">${esc(a.type)}</span></div><div class="activity-meta">${a.place?`<span class="row" style="gap:4px">${icon('pin')}${esc(a.place)}</span>`:''}${a.estimatedCents?`<span>預估 ${money(a.estimatedCents)}</span>`:''}${a.endTime?`<span>至 ${a.endDate&&a.endDate!==a.date?dateLabel(a.endDate)+' ':''}${esc(a.endTime)}${a.crossZone?' '+esc(a.arrivalZone):''}</span>`:''}</div></div>${link?`<a class="icon-btn" href="${esc(link)}" target="_blank" rel="noopener noreferrer" aria-label="在地圖查看${esc(a.title)}">${icon('arrow')}</a>`:''}</div>${a.crossZone?`<div class="activity-note">出發 ${esc(a.departureZone)} → 抵達 ${esc(a.arrivalZone)}<br>${esc(a.origin)} → ${esc(a.destination)}</div>`:''}${!compact&&a.notes?`<div class="activity-note">${esc(a.notes)}</div>`:''}${!compact?`<div class="row between" style="margin-top:10px"><label class="check-label small muted" style="min-height:36px"><input type="checkbox" class="check" data-check="activity" data-id="${a.id}" ${a.done?'checked':''}>已走訪</label><div class="row">${t.activities.some(b=>overlap(a,b))?'<span class="pill orange">時間重疊</span>':''}<button class="icon-btn" data-action="edit-activity" data-id="${a.id}" aria-label="編輯${esc(a.title)}">${icon('edit')}</button><button class="icon-btn" data-action="delete" data-kind="activities" data-id="${a.id}" aria-label="刪除${esc(a.title)}">${icon('trash')}</button></div></div>`:''}</div>`;}
function timeline(t,d,compact=false){let list=sortedActivities(t,d);if(!compact&&ui.activityFilter!=='全部')list=list.filter(x=>x.type===ui.activityFilter);if(compact)list=list.slice(0,4);if(!list.length)return empty('map','留一點期待，給這一天。','新增第一站，開始拼湊旅行的模樣。','new-activity','安排第一站');return `<div class="timeline">${list.map(a=>`<div class="timeline-item"><div class="timeline-time">${esc(a.startTime||'未定')}</div><div class="timeline-line"><i class="timeline-dot"></i></div>${activityCard(a,t,compact)}</div>`).join('')}</div>`;}
function empty(ic,title,sub,action,label){return `<div class="empty">${icon(ic)}<h3>${title}</h3><p>${sub}</p>${action?`<button class="btn" data-action="${action}">${icon('plus')}${label}</button>`:''}</div>`;}
const filterButtons=(group,current,opts)=>`<div class="segmented" aria-label="篩選">${opts.map(([v,l])=>`<button data-action="filter" data-kind="${group}" data-id="${v}" class="${current===v?'active':''}" aria-pressed="${current===v}">${l}</button>`).join('')}</div>`;
function prepare(t){const ts=t.tasks.filter(x=>ui.taskFilter==='all'||(ui.taskFilter==='done'?x.done:!x.done)), ps=t.packing.filter(x=>ui.packFilter==='all'||!x.packed);return `${heading('出發之前，慢慢準備。','把要做的、要帶的，從腦袋搬進清單裡。',`<button class="btn primary" data-action="new-task">${icon('plus')}新增待辦</button>`)}${t.kind==='international'?`<div class="notice">${icon('globe')}國外準備清單提供確認方向；護照、簽證與入境要求，請依目的地官方資訊確認。</div>`:''}<div class="section-grid"><section class="panel full"><div class="panel-head"><div class="panel-title">${icon('check')}<h3>行前待辦</h3><span class="pill">${t.tasks.filter(x=>x.done).length} / ${t.tasks.length}</span></div>${filterButtons('taskFilter',ui.taskFilter,[['all','全部'],['todo','未完成'],['done','已完成']])}</div>${ts.length?ts.map(x=>`<div class="list-row"><label class="check-label grow"><input class="check" type="checkbox" data-check="task" data-id="${x.id}" ${x.done?'checked':''}><span><span class="${x.done?'checked-title':''}">${esc(x.title)}</span><span class="small muted" style="display:block">${esc(x.category)}${x.dueDate?' · '+dateLabel(x.dueDate)+' 前':''}${x.notes?' · '+esc(x.notes):''}</span></span></label><span class="pill ${!x.done&&x.dueDate&&x.dueDate<TODAY()?'red':x.priority==='高'?'orange':''}">${!x.done&&x.dueDate&&x.dueDate<TODAY()?'已逾期':x.priority+'優先'}</span><div class="row"><button class="icon-btn" data-action="edit-task" data-id="${x.id}" aria-label="編輯${esc(x.title)}">${icon('edit')}</button><button class="icon-btn" data-action="delete" data-kind="tasks" data-id="${x.id}" aria-label="刪除${esc(x.title)}">${icon('trash')}</button></div></div>`).join(''):empty('check','清單很清爽。','這個篩選下沒有待辦。','new-task','新增待辦')}</section><div class="full"><div class="filterbar"><div><h2 class="serif">把安心，裝進行李。</h2><p class="small muted">已打包 ${t.packing.filter(x=>x.packed).length} / ${t.packing.length} 項 · 依 ${days(t)} 天旅程提供建議</p></div><div class="row wrap"><button class="btn" data-action="generate">${icon('spark')}補入建議</button><button class="btn" data-action="new-pack">${icon('plus')}自訂物品</button></div></div>${filterButtons('packFilter',ui.packFilter,[['all','所有物品'],['todo','還沒打包']])}</div>${packCats.map(cat=>{const list=ps.filter(x=>x.category===cat);if(!list.length)return '';return `<section class="panel"><div class="panel-head"><div class="panel-title">${icon(cat==='衣物'?'bag':cat==='電子用品'?'compass':cat==='活動用品'?'sun':'leaf')}<h3>${cat}</h3></div><span class="small muted">${list.length} 項</span></div>${list.map(x=>`<div class="list-row"><label class="check-label grow"><input type="checkbox" class="check" data-check="pack" data-id="${x.id}" ${x.packed?'checked':''}><span class="${x.packed?'checked-title':''}">${esc(x.name)} <small class="muted">× ${x.quantity}</small></span></label><button class="icon-btn" data-action="edit-pack" data-id="${x.id}" aria-label="編輯${esc(x.name)}">${icon('edit')}</button><button class="icon-btn" data-action="delete" data-kind="packing" data-id="${x.id}" aria-label="刪除${esc(x.name)}">${icon('trash')}</button></div>`).join('')}</section>`}).join('')}${!ps.length?`<section class="panel full">${empty('bag',t.packing.length?'行李準備好了。':'輕裝上陣，從清單開始。',t.packing.length?'帶著好心情，安心出發吧。':'依旅程天數和活動，補入適合的物品。','generate','產生打包建議')}</section>`:''}</div>`;}
function itinerary(t){const d=addDays(t.startDate,ui.day),outside=t.activities.filter(x=>x.date<t.startDate||x.date>t.endDate);return `${heading('每一天，都值得期待。','不用塞滿行程，留點時間給沿途的驚喜。',`<button class="btn primary" data-action="new-activity">${icon('plus')}新增行程</button>`)}<div class="day-tabs">${Array.from({length:days(t)},(_,i)=>`<button class="day-tab ${ui.day===i?'active':''}" data-action="day" data-id="${i}" aria-pressed="${ui.day===i}"><b>DAY ${String(i+1).padStart(2,'0')}</b><small>${dateLabel(addDays(t.startDate,i))} · ${['日','一','二','三','四','五','六'][new Date(addDays(t.startDate,i)+'T12:00:00').getDay()]}</small></button>`).join('')}</div><section class="panel"><div class="filterbar"><div><h3>${dateLong(d)}</h3><p class="small muted">${sortedActivities(t,d).length} 個安排 · 預估 ${money(sum(sortedActivities(t,d),a=>a.estimatedCents||0))}</p></div><select class="btn" data-change="activityFilter" aria-label="行程類型篩選">${['全部',...activityTypes].map(x=>`<option ${ui.activityFilter===x?'selected':''}>${x}</option>`).join('')}</select></div>${timeline(t,d)}</section>${outside.length?`<section class="panel" style="margin-top:20px"><div class="panel-head"><h3>日期需調整</h3><span class="pill orange">${outside.length} 筆</span></div><p class="small muted" style="margin-bottom:15px">這些行程位於旅程日期之外，資料已保留，請編輯調整。</p><div class="stack">${outside.map(a=>`<div><span class="small muted">${dateLong(a.date)}</span>${activityCard(a,t)}</div>`).join('')}</div></section>`:''}`;}
function balances(t){const result=Object.fromEntries(t.members.map(m=>[m.id,0]));for(const x of t.expenses){result[x.payerId]+=x.amountCents;const ids=t.members.filter(m=>x.participantIds.includes(m.id)).map(m=>m.id);const base=Math.floor(x.amountCents/ids.length),rem=x.amountCents%ids.length;ids.forEach((id,i)=>result[id]-=base+(i<rem?1:0));}for(const x of t.settlements){result[x.fromMemberId]+=x.amountCents;result[x.toMemberId]-=x.amountCents;}return result;}
function transfers(t){const b=balances(t),credit=t.members.filter(m=>b[m.id]>0).map(m=>({id:m.id,n:b[m.id]})),debt=t.members.filter(m=>b[m.id]<0).map(m=>({id:m.id,n:-b[m.id]})),out=[];let i=0,j=0;while(i<debt.length&&j<credit.length){const amount=Math.min(debt[i].n,credit[j].n);out.push({fromMemberId:debt[i].id,toMemberId:credit[j].id,amountCents:amount});debt[i].n-=amount;credit[j].n-=amount;if(!debt[i].n)i++;if(!credit[j].n)j++;}return out;}
const memberName=(t,id)=>t.members.find(m=>m.id===id)?.name||'未知成員';
function expenses(t){const total=sum(t.expenses,x=>x.amountCents),bal=balances(t),tr=transfers(t),list=t.expenses.filter(x=>ui.expenseFilter==='全部'||x.category===ui.expenseFilter).slice().sort((a,b)=>b.date.localeCompare(a.date)),budget=t.budgetCents;return `${heading('把旅費，算得剛剛好。','記下每一筆快樂，也把分帳變得簡單。',`<button class="btn primary" data-action="new-expense">${icon('plus')}記一筆旅費</button>`)}<div class="overview-grid"><div class="stack"><section class="panel"><div class="row between"><div><span class="eyebrow muted">TOTAL SPENT · TWD</span><div class="serif" style="font-size:39px;margin-top:8px">${money(total)}</div></div>${icon('wallet')}</div><div class="progress budget-bar ${budget!==null&&total>budget?'orange':''}"><i style="width:${budget?Math.min(100,pct(total,budget)):0}%"></i></div><div class="row between small muted"><span>${budget===null?'尚未設定預算':'預算 '+money(budget)}</span><span class="${budget!==null&&total>budget?'warning':''}">${budget===null?'':total>budget?'超出 '+money(total-budget):'剩餘 '+money(budget-total)}</span></div></section><section class="panel expense-list"><div class="panel-head"><h3>旅費明細</h3><select class="btn" data-change="expenseFilter" aria-label="支出分類篩選">${['全部',...categories].map(x=>`<option ${ui.expenseFilter===x?'selected':''}>${x}</option>`).join('')}</select></div>${list.length?list.map(x=>`<div class="list-row"><div class="category-icon">${icon(x.category==='餐飲'?'food':x.category==='交通'?'train':x.category==='住宿'?'bed':'wallet')}</div><div class="grow"><h4>${esc(x.title)}</h4><p>${dateLabel(x.date)} · ${esc(memberName(t,x.payerId))} 先付 · ${x.participantIds.length} 人分攤</p>${x.currency!=='TWD'?`<p>${esc(x.currency)} ${x.originalAmount.toLocaleString()} × ${x.rate}</p>`:''}</div><div class="amount">${money(x.amountCents)}</div><button class="icon-btn" data-action="edit-expense" data-id="${x.id}" aria-label="編輯${esc(x.title)}">${icon('edit')}</button><button class="icon-btn" data-action="delete" data-kind="expenses" data-id="${x.id}" aria-label="刪除${esc(x.title)}">${icon('trash')}</button></div>`).join(''):empty('wallet','把第一筆旅費記下來。','從一杯咖啡、一張車票開始。','new-expense','新增支出')}</section><section class="panel"><div class="panel-head"><h3>花在哪裡了？</h3><span class="small muted">全旅程統計</span></div><div class="bars">${categories.map(c=>{const n=sum(t.expenses.filter(x=>x.category===c),x=>x.amountCents);return n?`<div><div class="bar-label"><span>${c}</span><span>${money(n)} · ${pct(n,total)}%</span></div><div class="progress"><i style="width:${pct(n,total)}%"></i></div></div>`:''}).join('')||'<p class="small muted">新增旅費後，這裡會顯示支出分布。</p>'}</div></section></div><div class="stack"><section class="panel"><div class="panel-head"><div class="panel-title">${icon('people')}<h3>朋友之間，算清楚。</h3></div></div>${t.members.map(m=>`<div class="balance-row"><span>${esc(m.name)}</span><span class="${bal[m.id]>0?'balance-positive':bal[m.id]<0?'balance-negative':'muted'}">${bal[m.id]>0?'應收 ':bal[m.id]<0?'應付 ':'已平衡'}${bal[m.id]?money(Math.abs(bal[m.id])):''}</span></div>`).join('')}<div class="divider"></div><h4>結算建議</h4>${tr.length?tr.map((x,i)=>`<div class="settlement"><div>${esc(memberName(t,x.fromMemberId))} → ${esc(memberName(t,x.toMemberId))}<br><strong>${money(x.amountCents)}</strong></div><button class="btn" data-action="settle" data-id="${i}">已還款</button></div>`).join(''):`<p class="small muted" style="margin-top:12px">${t.expenses.length?'全部結清了，下次再一起旅行。':'目前沒有需要結算的款項。'}</p>`}<p class="small muted" style="margin-top:18px">每筆在勾選成員間均分，外幣依該筆保存的手動匯率換算台幣。</p></section>${t.settlements.length?`<section class="panel"><h3>已還款紀錄</h3>${t.settlements.map(x=>`<div class="list-row"><div class="grow"><h4>${esc(memberName(t,x.fromMemberId))} → ${esc(memberName(t,x.toMemberId))}</h4><p>${money(x.amountCents)} · ${dateLabel(x.date)}</p></div><button class="icon-btn" data-action="delete" data-kind="settlements" data-id="${x.id}" aria-label="撤銷還款">${icon('trash')}</button></div>`).join('')}</section>`:''}<div class="tip-card"><span class="eyebrow">GOOD TIMES, FAIR SHARES</span><h3>一起出發，也一起分擔。</h3><p>還款只調整應收應付，不會重複算進旅程花費。</p></div></div></div>`;}

function requireText(fd,key,label){const v=String(fd.get(key)||'').trim();if(!v)throw Error('請填寫'+label);return v;}
function num(fd,key,label,min=0,optional=false){const s=String(fd.get(key)||'');if(optional&&s==='')return null;const v=Number(s);if(s===''||!Number.isFinite(v)||v<min||v>1e9)throw Error(label+'請填入有效數值');return v;}
function cents(fd,key,label,optional=false){const n=num(fd,key,label,0,optional);if(n===null)return null;if(Math.abs(n*100-Math.round(n*100))>1e-6)throw Error(label+'最多兩位小數');return Math.round(n*100);}
function isDate(d){return typeof d==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(d)&&Number.isFinite(dateNum(d))&&new Date(dateNum(d)*86400000).toISOString().slice(0,10)===d;}
function checkDate(d){if(!isDate(d))throw Error('請填入有效日期');return d;}
function upsert(list,obj){const i=list.findIndex(x=>x.id===obj.id);if(i<0)list.push(obj);else list[i]=obj;}

function editPack(id){const t=trip(),x=t.packing.find(x=>x.id===id)||{id:uid(),name:'',category:'其他',quantity:1,packed:false,templateKey:null};openModal(id?'編輯打包物品':'多帶一點安心',`<div class="form-grid">${field('name','物品名稱',x.name,'text',{full:true,required:true})}${field('category','分類',x.category,'select',{options:packCats})}${field('quantity','數量',x.quantity,'number',{required:true,min:1,max:999,step:'1'})}</div>`,fd=>{const q=num(fd,'quantity','數量',1);if(!Number.isInteger(q)||q>999)throw Error('數量需為 1–999 的整數');upsert(t.packing,{...x,name:requireText(fd,'name','物品名稱'),category:fd.get('category'),quantity:q});done('打包清單已更新');});}
function zonedStamp(date,time,zone){const wanted=Date.parse(date+'T'+time+':00Z');let guess=wanted;const fmt=new Intl.DateTimeFormat('en-CA',{timeZone:zone,year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit',hourCycle:'h23'});for(let i=0;i<3;i++){const parts=Object.fromEntries(fmt.formatToParts(new Date(guess)).map(p=>[p.type,p.value]));const local=Date.parse(`${parts.year}-${parts.month}-${parts.day}T${parts.hour}:${parts.minute}:${parts.second}Z`);guess+=wanted-local;}const p=Object.fromEntries(fmt.formatToParts(new Date(guess)).map(p=>[p.type,p.value]));if(`${p.year}-${p.month}-${p.day}`!==date||`${p.hour}:${p.minute}`!==time)throw Error('此當地時間可能因夏令時間而不存在，請調整。');return guess;}
function editActivity(id){const t=trip(),x=t.activities.find(x=>x.id===id)||{id:uid(),title:'',date:addDays(t.startDate,ui.day),startTime:'',endTime:'',endDate:addDays(t.startDate,ui.day),type:'景點',place:'',mapUrl:'',estimatedCents:0,notes:'',origin:'',destination:'',crossZone:false,departureZone:'Asia/Taipei',arrivalZone:t.kind==='international'?'Asia/Tokyo':'Asia/Taipei',done:false,createdAt:Date.now()};openModal(id?'編輯這一站':'下一站，想去哪裡？',`<div class="form-grid">${field('title','行程名稱',x.title,'text',{full:true,required:true})}${field('type','行程類型',x.type,'select',{options:activityTypes})}${field('date','出發／活動日期',x.date,'date',{required:true})}${field('startTime','開始時間',x.startTime,'time')}${field('endTime','結束／抵達時間',x.endTime,'time')}${field('place','地點或地址',x.place,'text',{full:true})}${field('mapUrl','地圖網址（選填）',x.mapUrl,'url',{full:true,help:'不填網址也能依地點搜尋地圖。'})}${field('estimated','預估費用（TWD）',x.estimatedCents/100,'number',{min:0,step:'.01',full:true,help:'預估不會自動計入實際旅費。'})}<div class="field full"><label class="choice"><input type="checkbox" name="crossZone" id="cross-zone" ${x.crossZone?'checked':''}>跨日／跨時區交通</label></div><div id="zone-fields" class="form-grid full ${x.crossZone?'':'hidden'}" style="grid-column:1/-1">${field('origin','出發地',x.origin)}${field('destination','抵達地',x.destination)}${field('endDate','抵達日期',x.endDate||x.date,'date')}${field('departureZone','出發時區',x.departureZone,'select',{options:zones})}${field('arrivalZone','抵達時區',x.arrivalZone,'select',{options:zones})}<p class="small muted" style="grid-column:1/-1">填寫各地當地時間。夏令時間切換的重複時段請在備註記錄航班官方時間。</p></div>${field('notes','備註',x.notes,'textarea',{full:true})}</div>`,fd=>{const date=checkDate(fd.get('date')),startTime=fd.get('startTime'),endTime=fd.get('endTime'),cross=fd.has('crossZone'),endDate=cross?checkDate(fd.get('endDate')):date;if(endTime&&!startTime)throw Error('填寫結束時間前，請先填寫開始時間。');if(cross){if(!startTime||!endTime)throw Error('跨日／跨時區交通需填寫出發與抵達時間。');if(zonedStamp(endDate,endTime,fd.get('arrivalZone'))<zonedStamp(date,startTime,fd.get('departureZone')))throw Error('抵達時間換算後早於出發時間，請確認日期與時區。');}else if(startTime&&endTime&&endTime<startTime)throw Error('結束時間不可早於開始時間；跨日交通請勾選下方選項。');const link=fd.get('mapUrl').trim();if(link&&!validLink(link))throw Error('地圖網址需以 http:// 或 https:// 開頭。');upsert(t.activities,{...x,title:requireText(fd,'title','行程名稱'),date,startTime,endTime,endDate,type:fd.get('type'),place:fd.get('place').trim(),mapUrl:link,estimatedCents:cents(fd,'estimated','預估費用')||0,notes:fd.get('notes').trim(),crossZone:cross,origin:fd.get('origin').trim(),destination:fd.get('destination').trim(),departureZone:fd.get('departureZone'),arrivalZone:fd.get('arrivalZone')});if(date>=t.startDate&&date<=t.endDate)ui.day=Math.round(dateNum(date)-dateNum(t.startDate));done('這一站，已加入旅行');});$('#cross-zone').addEventListener('change',e=>$('#zone-fields').classList.toggle('hidden',!e.target.checked));}
function editExpense(id){const t=trip(),x=t.expenses.find(x=>x.id===id)||{id:uid(),title:'',date:TODAY(),currency:t.currency,originalAmount:'',rate:t.currency==='TWD'?1:'',amountCents:0,category:'餐飲',payerId:t.members[0].id,participantIds:t.members.map(m=>m.id),notes:''};openModal(id?'編輯這筆旅費':'記下一筆旅行的快樂',`<div class="form-grid">${field('title','消費項目',x.title,'text',{required:true,full:true})}${field('date','消費日期',x.date,'date',{required:true})}${field('category','分類',x.category,'select',{options:categories})}${field('originalAmount','原幣金額',x.originalAmount,'number',{required:true,min:'.01',step:'.01'})}${field('currency','消費幣別',x.currency,'select',{options:currencies})}${field('rate','手動匯率（1 原幣 = 幾 TWD）',x.rate,'number',{required:true,min:'.000001',step:'any',full:true,help:'不查詢即時匯率。每筆獨立保存，台幣固定為 1。'})}<div id="conversion" class="small muted" style="grid-column:1/-1"></div>${field('payerId','誰先付款？',x.payerId,'select',{full:true,options:t.members.map(m=>[m.id,m.name])})}${choices('participantIds','由誰分攤？至少選一位',t.members.map(m=>[m.id,m.name]),x.participantIds)}${field('notes','備註',x.notes,'textarea',{full:true})}</div>`,fd=>{const amount=cents(fd,'originalAmount','原幣金額')/100,rate=fd.get('currency')==='TWD'?1:num(fd,'rate','匯率',.000001);if(amount<=0)throw Error('金額需大於零');const converted=Math.round(amount*rate*100);if(!Number.isSafeInteger(converted)||converted<1||converted>1e11)throw Error('換算後金額需介於 NT$ 0.01 與 NT$ 1,000,000,000。');const ids=fd.getAll('participantIds');if(!ids.length)throw Error('至少勾選一位分攤成員');upsert(t.expenses,{...x,title:requireText(fd,'title','消費項目'),date:checkDate(fd.get('date')),currency:fd.get('currency'),originalAmount:amount,rate,amountCents:converted,category:fd.get('category'),payerId:fd.get('payerId'),participantIds:ids,notes:fd.get('notes').trim()});done('旅費已儲存，分帳也算好了');});const update=()=>{const tw=$('#f-currency').value==='TWD';$('#f-rate').readOnly=tw;if(tw)$('#f-rate').value=1;const a=Number($('#f-originalAmount').value),r=Number($('#f-rate').value);$('#conversion').textContent=a>0&&r>0?'換算台幣 '+money(Math.round(a*r*100)):'填寫金額與匯率後，顯示台幣換算結果。';};$('#f-currency').addEventListener('change',()=>{if($('#f-currency').value!=='TWD')$('#f-rate').value='';update();});$('#f-originalAmount').addEventListener('input',update);$('#f-rate').addEventListener('input',update);update();}
function editGift(id){const t=trip(),x=t.gifts.find(x=>x.id===id)||{id:uid(),name:'',recipient:'',quantity:1,place:'',estimatedCents:0,actualCents:null,status:'待購買',notes:''};openModal(id?'編輯伴手禮':'想把什麼，帶給誰？',`<div class="form-grid">${field('name','品名',x.name,'text',{full:true,required:true})}${field('recipient','送給誰',x.recipient)}${field('quantity','數量',x.quantity,'number',{required:true,min:1,max:999,step:1})}${field('place','購買地點',x.place,'text',{full:true})}${field('estimated','預估總額（TWD）',x.estimatedCents/100,'number',{min:0,step:'.01'})}${field('actual','實際總額（TWD，可留空）',x.actualCents===null?'':x.actualCents/100,'number',{min:0,step:'.01'})}${field('status','狀態',x.status,'select',{full:true,options:['待購買','已購買','已交付']})}${field('notes','備註',x.notes,'textarea',{full:true})}</div>`,fd=>{const quantity=num(fd,'quantity','數量',1);if(!Number.isInteger(quantity)||quantity>999)throw Error('數量需為 1–999 的整數');upsert(t.gifts,{...x,name:requireText(fd,'name','品名'),recipient:fd.get('recipient').trim(),quantity,place:fd.get('place').trim(),estimatedCents:cents(fd,'estimated','預估總額'),actualCents:cents(fd,'actual','實際總額',true),status:fd.get('status'),notes:fd.get('notes').trim()});done('這份心意，記下來了');});}
function confirmAction(title,copy,fn,label='確定'){openModal(title,`<p class="confirm-copy">${esc(copy)}</p>`,()=>{fn();},label);}
function settings(){const t=trip();openModal('旅程與資料',`<div class="stack"><div><h3>${esc(t.title)}</h3><p class="small muted">${dateLong(t.startDate)} — ${dateLong(t.endDate)}${t.isDemo?' · 虛構示範資料':''}</p></div><button type="button" class="btn" data-action="edit-trip">${icon('edit')}編輯旅程與同行者</button><div class="section-grid"><button type="button" class="btn" data-action="export">${icon('download')}匯出此旅程</button><button type="button" class="btn" data-action="import">${icon('upload')}匯入旅程副本</button></div><p class="small muted">資料只保存在此瀏覽器，不會自動同步。清除瀏覽器網站資料前，請先匯出備份。私人的備份檔案不應上傳公開 GitHub。</p><button type="button" class="btn danger" data-action="delete-trip">${icon('trash')}刪除此旅程</button></div>`,()=>closeModal(true),'完成');}
function download(data,name){const blob=new Blob([data],{type:'application/json;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
function exportTrip(){const t=trip();if(!t)return toast('先建立旅程，才能匯出');download(JSON.stringify({schemaVersion:1,exportedAt:new Date().toISOString(),trip:t},null,2),`旅序-${t.title.replace(/[<>:"/\\|?*]/g,'_')}-${TODAY()}.json`);toast('已匯出旅程備份');}
function validateTrip(t){const fail=msg=>{throw Error('備份資料格式不正確：'+msg)};const text=(v,max=2000)=>typeof v==='string'&&v.length<=max;const integer=(v,min=0,max=1e11)=>Number.isSafeInteger(v)&&v>=min&&v<=max;const amount=v=>integer(v);const date=v=>isDate(v);if(!t||typeof t!=='object'||!text(t.id,100)||!text(t.title,150)||!t.title.trim()||!text(t.destination,150)||!date(t.startDate)||!date(t.endDate)||days(t)<1||days(t)>30||!['domestic','international'].includes(t.kind)||!currencies.includes(t.currency)||!(t.budgetCents===null||amount(t.budgetCents))||!Array.isArray(t.tags)||t.tags.some(x=>!tags.includes(x)))fail('旅程設定');const arrays=['members','tasks','packing','activities','expenses','settlements','gifts'];const seen=new Set();for(const key of arrays){if(!Array.isArray(t[key])||t[key].length>10000)fail(key);for(const x of t[key]){if(!x||!text(x.id,100)||!x.id||seen.has(x.id))fail('項目 ID 重複或無效');seen.add(x.id);}}if(!t.members.length||t.members.length>20||t.members.some(m=>!text(m.name,150)||!m.name.trim())||new Set(t.members.map(m=>m.name)).size!==t.members.length)fail('同行者');const ids=t.members.map(m=>m.id);for(const x of t.tasks){if(!text(x.title)||!text(x.notes)||!['交通','住宿','票券','其他'].includes(x.category)||!['高','中','低'].includes(x.priority)||typeof x.done!=='boolean'||!(x.dueDate===''||date(x.dueDate)))fail('待辦');}for(const x of t.packing){if(!text(x.name)||!packCats.includes(x.category)||!integer(x.quantity,1,999)||typeof x.packed!=='boolean'||!(x.templateKey===null||text(x.templateKey,100)))fail('打包物品');}for(const x of t.activities){if(!text(x.title)||!date(x.date)||!activityTypes.includes(x.type)||!text(x.notes)||!text(x.place)||!text(x.mapUrl)||x.mapUrl&&!validLink(x.mapUrl)||!amount(x.estimatedCents)||typeof x.done!=='boolean'||typeof x.crossZone!=='boolean'||!Number.isFinite(x.createdAt)||!text(x.origin)||!text(x.destination)||![x.startTime,x.endTime].every(s=>s===''||typeof s==='string'&&/^([01]\d|2[0-3]):[0-5]\d$/.test(s)))fail('行程');if(x.crossZone){if(!date(x.endDate)||!zones.includes(x.departureZone)||!zones.includes(x.arrivalZone)||!x.startTime||!x.endTime||zonedStamp(x.endDate,x.endTime,x.arrivalZone)<zonedStamp(x.date,x.startTime,x.departureZone))fail('跨時區行程');}else if(x.endTime&&(!x.startTime||x.endTime<x.startTime))fail('行程時間');}for(const x of t.expenses){if(!text(x.title)||!text(x.notes)||!date(x.date)||!integer(x.amountCents,1)||!currencies.includes(x.currency)||!Number.isFinite(x.originalAmount)||x.originalAmount<=0||!Number.isFinite(x.rate)||x.rate<=0||x.currency==='TWD'&&x.rate!==1||Math.round(x.originalAmount*x.rate*100)!==x.amountCents||!categories.includes(x.category)||!ids.includes(x.payerId)||!Array.isArray(x.participantIds)||!x.participantIds.length||new Set(x.participantIds).size!==x.participantIds.length||x.participantIds.some(id=>!ids.includes(id)))fail('旅費與分攤');}for(const x of t.settlements){if(!date(x.date)||!integer(x.amountCents,1)||!ids.includes(x.fromMemberId)||!ids.includes(x.toMemberId)||x.fromMemberId===x.toMemberId)fail('還款');}for(const x of t.gifts){if(!text(x.name)||!text(x.recipient)||!text(x.place)||!text(x.notes)||!integer(x.quantity,1,999)||!amount(x.estimatedCents)||!(x.actualCents===null||amount(x.actualCents))||!['待購買','已購買','已交付'].includes(x.status))fail('伴手禮');}return true;}
function importData(obj){if(!obj||obj.schemaVersion!==1)throw Error('不支援此備份版本，請使用旅序 v1 備份。');validateTrip(obj.trip);const t=JSON.parse(JSON.stringify(obj.trip)),mapping={};t.id=uid();t.title=(t.title+'（匯入）').slice(0,150);for(const m of t.members){const id=uid();mapping[m.id]=id;m.id=id;}for(const key of ['tasks','packing','activities','expenses','settlements','gifts'])for(const x of t[key]){x.id=uid();if(key==='expenses'){x.payerId=mapping[x.payerId];x.participantIds=x.participantIds.map(id=>mapping[id]);}if(key==='settlements'){x.fromMemberId=mapping[x.fromMemberId];x.toMemberId=mapping[x.toMemberId];}}return t;}
$('#import-file').addEventListener('change',async e=>{const file=e.target.files[0];e.target.value='';if(!file)return;try{if(file.size>2*1024*1024)throw Error('檔案超過 2 MB，請選擇較小的旅程備份。');const t=importData(JSON.parse(await file.text()));state.trips.push(t);state.activeTripId=t.id;ui.page='overview';ui.day=0;closeModal(true);save();render();toast('已匯入旅程副本，原本的旅程保留不變');}catch(err){confirmAction('無法匯入這份備份',err instanceof SyntaxError?'檔案不是有效的 JSON，原本資料未變更。':err.message,()=>closeModal(true),'知道了');}});
$('#modal').addEventListener('cancel',e=>{e.preventDefault();closeModal();});
document.addEventListener('click',e=>{const el=e.target.closest('[data-action]');if(!el)return;const {action,id,kind}=el.dataset,t=trip();if(action==='close-modal')return closeModal();if(action==='new-trip'){if($('#modal').open)closeModal(true);return editTrip();}if(action==='demo')return demo();if(action==='import')return $('#import-file').click();if(action==='recover-storage')return confirmAction('保留原始資料，重新開始儲存','會先下載瀏覽器中無法讀取的原始資料，再以目前畫面中的旅程重新啟用儲存。',()=>{try{download(localStorage.getItem(KEY)||'{}','wayfar-recovery.json');loadError=false;done('原始資料已備份，已重新嘗試儲存');}catch{toast('無法存取瀏覽器儲存空間');}},'備份並重新啟用');if(!t)return toast('先建立一段旅程，或體驗台南示範');switch(action){case 'nav':ui.page=id;render();window.scrollTo({top:0,behavior:'instant'});break;case 'settings':settings();break;case 'edit-trip':closeModal(true);editTrip(t);break;case 'export':exportTrip();break;case 'delete-trip':closeModal(true);confirmAction('刪除這段旅程？','將刪除「'+t.title+'」及所有行程與帳務。這個動作無法復原，建議先在旅程設定中匯出備份。',()=>{state.trips=state.trips.filter(x=>x.id!==t.id);state.activeTripId=state.trips[0]?.id||null;ui.page='overview';done('旅程已刪除');},'確定刪除');break;case 'new-task':editTask();break;case 'edit-task':editTask(id);break;case 'new-pack':editPack();break;case 'edit-pack':editPack(id);break;case 'new-activity':editActivity();break;case 'edit-activity':editActivity(id);break;case 'new-expense':editExpense();break;case 'edit-expense':editExpense(id);break;case 'new-gift':editGift();break;case 'edit-gift':editGift(id);break;case 'generate':{const n=addSuggestions(t);save();render();toast(n?`已補入 ${n} 項建議，原有項目已保留`:'建議都在清單裡了，沒有新增重複項目');break;}case 'filter':ui[kind]=id;render();break;case 'day':ui.day=Number(id);render();break;case 'delete':{if(!['tasks','packing','activities','expenses','settlements','gifts'].includes(kind))break;const x=t[kind].find(x=>x.id===id);confirmAction(kind==='settlements'?'撤銷這筆還款？':'刪除這個項目？',kind==='settlements'?'撤銷後，將重新計算每個人的應收應付。':`「${x.title||x.name}」將從旅程中移除。`,()=>{t[kind]=t[kind].filter(x=>x.id!==id);done(kind==='settlements'?'還款已撤銷':'項目已刪除');},kind==='settlements'?'撤銷還款':'刪除');break;}case 'settle':{const x=transfers(t)[Number(id)];if(x)confirmAction('確認已收到還款？',`${memberName(t,x.fromMemberId)} 已付給 ${memberName(t,x.toMemberId)} ${money(x.amountCents)}。\n這會新增還款紀錄，可在下方撤銷。`,()=>{t.settlements.push({...x,id:uid(),date:TODAY()});done('還款已記錄');},'確認已還款');break;}}});
document.addEventListener('change',e=>{const el=e.target,t=trip();if(el.dataset.check&&t){const map={task:['tasks','done'],pack:['packing','packed'],activity:['activities','done']},[key,prop]=map[el.dataset.check],x=t[key].find(x=>x.id===el.dataset.id);if(x){x[prop]=el.checked;save();const checked=el.checked;render();const replacement=$(`[data-check="${el.dataset.check}"][data-id="${el.dataset.id}"]`);replacement?.focus({preventScroll:true});if(el.dataset.check==='pack'&&checked&&t.packing.every(x=>x.packed))toast('行李準備好了，帶著好心情出發');}return;}switch(el.dataset.change){case 'trip':state.activeTripId=el.value;ui.day=0;save();render();break;case 'expenseFilter':case 'activityFilter':ui[el.dataset.change]=el.value;render();break;case 'gift-status':{const x=t?.gifts.find(x=>x.id===el.dataset.id);if(x){x.status=el.value;save();render();toast('伴手禮狀態已更新');}break;}}});
window.addEventListener('hashchange',()=>{if(location.hash==='#overview'){ui.page='overview';render();}});
render();
</script>
